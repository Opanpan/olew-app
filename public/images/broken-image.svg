<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="dark-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Light background (default) -->
  <rect id="light" width="300" height="300" fill="url(#bg)"/>

  <!-- Border -->
  <rect x="1" y="1" width="298" height="298" fill="none"
        stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8"/>

  <!-- Broken image icon frame -->
  <rect x="90" y="80" width="120" height="96" rx="8"
        fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Mountains inside frame -->
  <path d="M98,164 L128,120 L152,148 L168,130 L202,164 Z"
        fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Sun circle -->
  <circle cx="116" cy="104" r="10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Crack / break lines across icon -->
  <line x1="148" y1="80" x2="138" y2="108" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="108" x2="152" y2="128" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="152" y1="128" x2="144" y2="176" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- X mark -->
  <circle cx="196" cy="86" r="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <line x1="191" y1="81" x2="201" y2="91" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <line x1="201" y1="81" x2="191" y2="91" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Text -->
  <text x="150" y="210" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="12" font-weight="600"
        fill="#64748b" letter-spacing="0.5">Gambar tidak tersedia</text>
  <text x="150" y="228" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="10"
        fill="#94a3b8">Image unavailable</text>

  <!-- Brand dot -->
  <circle cx="150" cy="256" r="3" fill="#2b87f5" opacity="0.5"/>
</svg>
