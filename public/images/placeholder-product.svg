<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1557b8"/>
      <stop offset="100%" stop-color="#0a347a"/>
    </linearGradient>
    <linearGradient id="bottleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="300" height="400" fill="url(#bg)"/>
  <rect width="300" height="400" fill="url(#dots)"/>

  <!-- Bottle group centred at 150,200 -->
  <g transform="translate(150,210)">
    <!-- Cap -->
    <rect x="-15" y="-148" width="30" height="14" rx="5" fill="white" opacity="0.5"/>
    <!-- Neck ring -->
    <rect x="-12" y="-134" width="24" height="6" rx="2" fill="white" opacity="0.3"/>

    <!-- Shoulder -->
    <path d="M-12,-128 C-28,-112 -36,-92 -36,-72 L36,-72 C36,-92 28,-112 12,-128 Z"
          fill="url(#bottleFill)" stroke="white" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Body -->
    <rect x="-36" y="-72" width="72" height="155" rx="5"
          fill="url(#bottleFill)" stroke="white" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Bottom dome -->
    <ellipse cx="0" cy="83" rx="36" ry="8" fill="white" opacity="0.15"/>

    <!-- Label -->
    <rect x="-26" y="-35" width="52" height="72" rx="4"
          fill="white" opacity="0.08" stroke="white" stroke-width="0.8" stroke-opacity="0.25"/>
    <rect x="-16" y="-22" width="32" height="2" rx="1" fill="white" opacity="0.4"/>
    <rect x="-12" y="-16" width="24" height="2" rx="1" fill="white" opacity="0.3"/>
    <text x="0" y="4" text-anchor="middle"
          font-family="Georgia, serif" font-size="10" font-weight="bold"
          fill="white" opacity="0.7" letter-spacing="3">OLEW</text>
    <rect x="-12" y="12" width="24" height="2" rx="1" fill="white" opacity="0.3"/>
    <rect x="-16" y="18" width="32" height="2" rx="1" fill="white" opacity="0.4"/>

    <!-- Shine -->
    <path d="M-30,-128 L-20,-128 L-20,78 Q-25,82 -30,78 Z"
          fill="url(#shine)"/>
  </g>

  <!-- Bottom brand -->
  <text x="150" y="365" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="9" font-weight="700"
        fill="white" opacity="0.45" letter-spacing="4">OLEW GROUP</text>
  <text x="150" y="379" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="7.5"
        fill="white" opacity="0.3" letter-spacing="2">PREMIUM PACKAGING</text>
</svg>
