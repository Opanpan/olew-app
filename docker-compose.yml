version: '3.8'

services:
  olew-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: olew-group-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development

  olew-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olew-group-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
